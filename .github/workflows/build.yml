name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Proje dosyalarını oluştur
        run: |
          mkdir -p app/src/main/java/com/ornek/sayac
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "SayacApp"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.1.4' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.10' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.ornek.sayac'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ornek.sayac"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions { jvmTarget = '1.8' }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Sayaç"
                  android:theme="@style/Theme.AppCompat.DayNight">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/ornek/sayac/MainActivity.kt << 'EOF'
          package com.ornek.sayac

          import android.os.Bundle
          import android.widget.Button
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private var sayi = 0
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  val text = findViewById<TextView>(R.id.sayiText)
                  findViewById<Button>(R.id.artirBtn).setOnClickListener {
                      sayi++; text.text = sayi.toString()
                  }
                  findViewById<Button>(R.id.azaltBtn).setOnClickListener {
                      sayi--; text.text = sayi.toString()
                  }
                  findViewById<Button>(R.id.sifirlaBtn).setOnClickListener {
                      sayi = 0; text.text = sayi.toString()
                  }
              }
          }
          EOF

          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp">
              <TextView
                  android:id="@+id/sayiText"
                  android:text="0"
                  android:textSize="72sp"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"/>
              <Button
                  android:id="@+id/artirBtn"
                  android:text="+ Artır"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="24dp"/>
              <Button
                  android:id="@+id/azaltBtn"
                  android:text="- Azalt"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"/>
              <Button
                  android:id="@+id/sifirlaBtn"
                  android:text="Sıfırla"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"/>
          </LinearLayout>
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">Sayaç</string>
          </resources>
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sayac-apk
          path: app/build/outputs/apk/debug/app-debug.apk
