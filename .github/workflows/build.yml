name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dosyaları Oluştur
        run: |
          mkdir -p app/src/main/java/com/ornek/sayac
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          echo "rootProject.name = \"SayacApp\"" > settings.gradle
          echo "include ':app'" >> settings.gradle

          echo "plugins { id 'com.android.application' version '8.1.4' apply false }" > build.gradle
          echo "plugins { id 'org.jetbrains.kotlin.android' version '1.9.10' apply false }" >> build.gradle

          echo "android.useAndroidX=true" > gradle.properties

          echo "plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }" > app/build.gradle
          echo "android { namespace 'com.ornek.sayac'; compileSdk 34; defaultConfig { applicationId 'com.ornek.sayac'; minSdk 21; targetSdk 34; versionCode 1; versionName '1.0' } }" >> app/build.gradle
          echo "dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }" >> app/build.gradle

          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Sayaç" android:theme="@style/Theme.AppCompat.DayNight"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml

          echo 'package com.ornek.sayac; import android.os.Bundle; import android.widget.Button; import android.widget.TextView; import androidx.appcompat.app.AppCompatActivity; public class MainActivity extends AppCompatActivity { private int sayi = 0; @Override protected void onCreate(Bundle savedInstanceState) { super.onCreate(savedInstanceState); setContentView(R.layout.activity_main); TextView text = findViewById(R.id.sayiText); findViewById(R.id.artirBtn).setOnClickListener(v -> { sayi++; text.setText(String.valueOf(sayi)); }); findViewById(R.id.azaltBtn).setOnClickListener(v -> { sayi--; text.setText(String.valueOf(sayi)); }); findViewById(R.id.sifirlaBtn).setOnClickListener(v -> { sayi = 0; text.setText(String.valueOf(sayi)); }); } }' > app/src/main/java/com/ornek/sayac/MainActivity.java

          echo '<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:gravity="center" android:padding="24dp"><TextView android:id="@+id/sayiText" android:text="0" android:textSize="72sp" android:layout_width="wrap_content" android:layout_height="wrap_content"/><Button android:id="@+id/artirBtn" android:text="+ Artır" android:layout_width="match_parent" android:layout_height="wrap_content"/><Button android:id="@+id/azaltBtn" android:text="- Azalt" android:layout_width="match_parent" android:layout_height="wrap_content"/><Button android:id="@+id/sifirlaBtn" android:text="Sıfırla" android:layout_width="match_parent" android:layout_height="wrap_content"/></LinearLayout>' > app/src/main/res/layout/activity_main.xml

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.4
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sayac-apk
          path: app/build/outputs/apk/debug/app-debug.apk
